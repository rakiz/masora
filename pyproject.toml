[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "masora"
version = "0.6.0"
description = "Git-backed, append-only knowledge base of claims anchored to code, with verification lifecycle and self-invalidation."
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.10",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[project.scripts]
masora = "masora.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["masora"]
